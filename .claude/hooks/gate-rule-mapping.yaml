# Gate-Rule 対応表
#
# ADR-0025: AIOS コンポーネント配置フレームワーク
# このリポジトリはプロジェクト固有 Gate を持たない（グローバル Gate のみ適用）。
# グローバル Gate は ~/.claude/hooks/gate-rule-mapping.yaml に記載。
#
# 更新ルール: 新規プロジェクト固有 Gate 追加時に必ず更新
# 生成: 2026-02-22 (Issue #712 全リポジトリ整備)

version: "1"

# =============================================
# プロジェクト固有 Gate（現在なし）
# =============================================
project_gates: []

# =============================================
# グローバル Gate 参照
# =============================================
global_gates_ref: "~/.claude/hooks/gate-rule-mapping.yaml"

notes:
  - "AIOS 準拠状態: プロジェクト固有 Gate なし。グローバル Gate のみ適用"
  - "プロジェクト固有 Guard が必要になった場合はここに追加し .claude/settings.json に登録する"
